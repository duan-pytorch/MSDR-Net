# Default training configuration for MSDR-Net and all comparison models.
# Values correspond to the selected configuration reported in the manuscript
# (Supplementary Table S6). The same search space, selection criterion, and
# training strategy were applied to MSDR-Net and all comparison models.

experiment:
  num_classes: 2
  class_names: ["benign", "malignant"]
  positive_class: 1            # malignant tumors are the positive class
  input_size: 224
  in_channels: 3               # single-channel grayscale replicated to three channels

data:
  index_csv: "data_root/index.csv"   # see data/README.md for the expected schema
  image_root: "data_root/processed"
  # Patient-level partition; each patient appears in exactly one subset.
  split_column: "split"              # values: train / val / test

# Hyperparameter search space (configuration selection stage, five-fold CV):
#   learning_rate: [1e-3, 1e-4, 1e-5]
#   batch_size:    [8, 16, 32]
#   weight_decay:  [1e-2, 1e-3, 1e-4]
# Selected / final values:
training:
  optimizer: "adamw"
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  betas: [0.9, 0.999]
  batch_size: 16
  epochs: 200
  lr_schedule: "multistep"
  lr_milestones: [80, 140]
  lr_gamma: 0.1
  amp: true                    # automatic mixed precision
  early_stopping:
    monitor: "val_auc"
    patience: 20
  checkpoint: "best_val_auc"
  class_weighting: "inverse_frequency"   # w_c = N_train / (n_classes * N_c); w_pos = 2.27, w_neg = 0.64
  num_workers: 4

# Training-only data augmentation (never applied to validation/test).
augmentation:
  horizontal_flip_p: 0.5
  rotation_degrees: 10
  translate_fraction: 0.05
  brightness: 0.10
  contrast: 0.10

# Run protocol (Section 2.6):
runs:
  selection_seeds: [2021, 2022, 2023]  # three independent runs; highest validation AUC carried forward
  cross_validation_seed: 2024          # single prespecified run per fold (stability assessment only)
  deterministic: true                  # cuDNN deterministic mode on, benchmark mode off

evaluation:
  decision_threshold: 0.5              # prespecified; never tuned on any data
  ci_level: 0.95
  bootstrap:
    resamples: 50000
    seed: 2025
    method: "patient_level_joint_percentile"
  ece_bins: 10
  dca:
    threshold_min: 0.0
    threshold_max: 0.8
    threshold_step: 0.01

output:
  dir: "outputs"
